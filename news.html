<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新消息 | 躍齡扶輪社官方網站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="news">

  <!-- 頁首與導覽列由 js/main.js 產生（全站共用，只需改一處） -->
  <header id="siteHeader"></header>

  <div class="page-hero">
    <h1>最新消息 (News)</h1>
  </div>

  <main class="container">

    <!-- B1: 例會時間與地點公告（與「聯絡我們」共用同一份資料） -->
    <section class="content-box" id="meeting">
      <div class="section-head">
        <h3>例會時間與地點公告</h3>
        <div class="toolbar" id="meetingTools"></div>
      </div>
      <div id="meetingBody"></div>
      <p class="meta-text" id="meetingUpdated"></p>
    </section>

    <!-- B2: 重大行事曆 -->
    <section class="content-box" id="calendar">
      <div class="section-head">
        <h3>重大行事曆</h3>
        <div class="toolbar" id="calendarTools"></div>
      </div>
      <div class="calendar-list" id="calendarList"></div>
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="js/main.js"></script>
  <script src="js/page-news.js"></script>
</body>
</html>
