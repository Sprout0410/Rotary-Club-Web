<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動與展覽 | 躍齡扶輪社官方網站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="events">

  <!-- 頁首與導覽列由 js/main.js 產生（全站共用，只需改一處） -->
  <header id="siteHeader"></header>

  <div class="page-hero">
    <h1>活動與展覽 (Events)</h1>
  </div>

  <main class="container">

    <!-- C1: 近期活動與線上報名（活動由管理員建立） -->
    <section class="content-box" id="register">
      <div class="section-head">
        <h3>近期活動與線上報名</h3>
        <div class="toolbar" id="eventTools"></div>
      </div>
      <div id="eventList"><p class="empty-state">載入中…</p></div>
      <div id="pastEvents"></div>
    </section>

    <!-- C2: 活動相簿 -->
    <section class="content-box" id="gallery">
      <div class="section-head">
        <h3>活動相簿</h3>
        <div class="toolbar" id="albumTools"></div>
      </div>
      <div id="albumList"><p class="empty-state">載入中…</p></div>
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="js/main.js"></script>
  <script src="js/page-events.js"></script>
</body>
</html>
