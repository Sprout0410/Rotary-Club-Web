<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關於我們 | 躍齡扶輪社官方網站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="about">

  <!-- 頁首與導覽列由 js/main.js 產生（全站共用，只需改一處） -->
  <header id="siteHeader"></header>

  <div class="page-hero">
    <h1>關於我們 (About Us)</h1>
  </div>

  <main class="container">

    <!-- A1: 創社歷史與宗旨 -->
    <section class="content-box" id="history">
      <div class="section-head">
        <h3>創社歷史與宗旨</h3>
        <div class="toolbar" id="historyTools"></div>
      </div>
      <div class="rich-text" id="historyBody"></div>
    </section>

    <!-- A2: 歷屆社長與幹部（管理員可編輯） -->
    <section class="content-box" id="presidents">
      <div class="section-head">
        <h3>歷屆社長與幹部</h3>
        <div class="toolbar" id="presidentTools"></div>
      </div>
      <div class="marquee-list" id="presidentList"></div>
    </section>

    <!-- A3: 現任社友名錄（管理員可編輯） -->
    <section class="content-box" id="members">
      <div class="section-head">
        <h3>現任社友名錄</h3>
        <div class="toolbar" id="memberTools"></div>
      </div>
      <div class="member-grid" id="memberGrid"></div>
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="js/main.js"></script>
  <script src="js/page-about.js"></script>
</body>
</html>
