<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們 | 躍齡扶輪社官方網站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">

  <!-- 頁首與導覽列由 js/main.js 產生（全站共用，只需改一處） -->
  <header id="siteHeader"></header>

  <div class="page-hero">
    <h1>聯絡我們 (Contact)</h1>
  </div>

  <main class="container">

    <!-- E1: 線上諮詢表單 -->
    <section class="content-box" id="form">
      <h3>線上諮詢與聯繫表單</h3>
      <div class="form-wrap">
        <!-- 目前為模擬送出；未來轉寄至秘書處或社長信箱 -->
        <form onsubmit="alert('模擬發送成功！您的諮詢訊息已記錄，未來將轉寄至秘書處或社長信箱。'); return false;">

          <div class="form-group">
            <label for="contactName">訪客姓名 / 服務單位：</label>
            <input type="text" id="contactName" name="name" class="form-control" placeholder="請輸入姓名或友社名稱" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="contactEmail">電子郵件 (Email)：</label>
            <input type="email" id="contactEmail" name="email" class="form-control" placeholder="example@email.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="contactPhone">聯絡電話 / 手機：</label>
            <input type="tel" id="contactPhone" name="phone" class="form-control" placeholder="請輸入方便聯絡之電話" autocomplete="tel">
          </div>

          <div class="form-group">
            <label for="contactSubject">諮詢主旨：</label>
            <select id="contactSubject" name="subject" class="form-control" required>
              <option value="">-- 請選擇來函事由 --</option>
              <option value="join">入社諮詢與意願洽談</option>
              <option value="visit">友社例會補出席 / 跨社聯誼邀約</option>
              <option value="speech">專題演講邀約 / 合作提案</option>
              <option value="other">其他一般行政事務詢問</option>
            </select>
          </div>

          <div class="form-group">
            <label for="contactMessage">詳細諮詢內容：</label>
            <textarea id="contactMessage" name="message" class="form-control" rows="4" placeholder="請在此填寫您想討論或詢問的詳細內容..." required></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--block btn--lg">發送諮詢訊息</button>
          </div>

        </form>
      </div>
    </section>

    <!-- E2: 例會交通與地圖 -->
    <section class="content-box" id="map">
      <h3>例會交通與地理位置</h3>
      <div class="info-grid">
        <div class="info-card-clean">
          <div class="card-title-row"><h4>例會固定地點資訊</h4><span id="meetingTools"></span></div>
          <div id="meetingBody"></div>
        </div>
        <div class="info-card-clean">
          <div class="card-title-row"><h4>交通與停車指南</h4><span id="trafficTools"></span></div>
          <div class="rich-text" id="trafficBody"></div>
        </div>
      </div>

      <!-- 地圖會依「例會地址」自動顯示 -->
      <div id="mapBox" class="map-box"></div>
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="js/main.js"></script>
  <script src="js/page-contact.js"></script>
</body>
</html>
