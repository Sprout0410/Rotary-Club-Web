<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>躍齡扶輪社官方網站 | Yue-Ling Rotary Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

  <!-- 頁首與導覽列由 js/main.js 產生（全站共用，只需改一處） -->
  <header id="siteHeader"></header>

  <!-- 首頁重大活動展示區（內容由管理員在網頁上編輯，存在資料庫） -->
  <section class="hero-slider" id="heroSlider">
    <div id="heroSlides"></div>
    <button type="button" class="slider-btn prev-btn" aria-label="上一張" onclick="changeSlide(-1)">&#10094;</button>
    <button type="button" class="slider-btn next-btn" aria-label="下一張" onclick="changeSlide(1)">&#10095;</button>
    <div class="hero-admin" id="heroAdmin"></div>
  </section>

  <main class="container">
    <div class="grid-4">

      <!-- 卡片 1：歷任社長輪播（資料來自「關於我們」的歷屆社長） -->
      <div class="card">
        <div class="card-header">
          <span>歷任會長與成員</span>
          <a href="about.html#presidents">查看全部</a>
        </div>
        <div class="card-body card-body--center">
          <div class="pres-slider-wrap">
            <div class="pres-slides" id="presSlides"></div>
            <button type="button" class="pres-btn pres-prev" aria-label="上一位" onclick="changePresSlide(-1)">&#10094;</button>
            <button type="button" class="pres-btn pres-next" aria-label="下一位" onclick="changePresSlide(1)">&#10095;</button>
          </div>
        </div>
      </div>

      <!-- 卡片 2：FB 粉絲團嵌入 -->
      <div class="card">
        <div class="card-header">
          <span>臉書官方粉絲團</span>
          <a href="https://www.facebook.com/beyondage20210321/?locale=zh_TW" target="_blank" rel="noopener">追蹤我們</a>
        </div>
        <div class="card-body card-body--fb">
          <div class="fb-embed">
            <iframe
              title="躍齡扶輪社 Facebook 粉絲專頁"
              src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fbeyondage20210321&tabs=timeline&width=340&height=380&small_header=true&adapt_container_width=false&hide_cover=true&show_facepile=false&appId"
              width="340"
              height="380"
              scrolling="no"
              allowfullscreen="true"
              allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
            </iframe>
          </div>
        </div>
      </div>

      <!-- 卡片 3：最新活動相簿 -->
      <div class="card">
        <div class="card-header">
          <span>歷史活動紀錄</span>
          <a href="events.html#gallery">進入專區</a>
        </div>
        <div class="card-body">
          <div class="marquee-list" id="homeAlbums"></div>
        </div>
      </div>

      <!-- 卡片 4：近期活動（管理員可從這裡建立新活動） -->
      <div class="card card--alert">
        <div class="card-header">
          <span>現時與近期活動</span>
          <a href="events.html#register">全部活動</a>
        </div>
        <div class="card-body">
          <div class="marquee-list" id="homeEvents"></div>
        </div>
      </div>

    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/main.js"></script>
  <script src="js/page-home.js"></script>
</body>
</html>
